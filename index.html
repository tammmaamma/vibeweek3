<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>heeyeon 소개</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #fff8f0 0%, #eaf6ee 50%, #ffe9f1 100%);
      padding: 40px 16px;
    }

    .card {
      background: #fffdf9;
      border: 3px dashed #ffb6c9;
      border-radius: 28px;
      padding: 40px 36px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(255, 154, 187, 0.22);
      text-align: center;
    }

    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 6px solid #ffd6e8;
      box-shadow: 0 8px 18px rgba(255, 154, 187, 0.35);
    }

    .name {
      margin: 20px 0 6px;
      font-size: 26px;
      font-weight: 700;
      color: #5c3a4a;
    }

    .name-deco {
      font-size: 20px;
    }

    .tagline {
      margin: 0 0 24px;
      font-size: 15px;
      color: #6b4f5a;
      line-height: 1.5;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #a8447b;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .likes {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .likes li {
      background: #fdf1f5;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 15px;
      color: #6b4f5a;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .likes li:nth-child(1) {
      background: #ffe9f2;
    }

    .likes li:nth-child(2) {
      background: #e3f4ea;
    }

    .likes li:nth-child(3) {
      background: #fff3d9;
    }

    .emoji {
      font-size: 18px;
    }

    .mood-section {
      margin-top: 24px;
    }

    .mood-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .mood-btn {
      width: 52px;
      height: 52px;
      border: none;
      border-radius: 50%;
      background: #fdf1f5;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    @media (hover: hover) {
      .mood-btn:hover {
        background: #ffe0eb;
      }
    }

    .mood-btn:active {
      transform: scale(0.95);
    }

    .mood-btn.is-selected {
      background: #ffd6e8;
      border: 2px solid #a8447b;
      box-shadow: 0 4px 10px rgba(184, 68, 123, 0.25);
    }

    .mood-message {
      min-height: 21px;
      margin: 0;
      font-size: 14px;
      color: #6b4f5a;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="avatar" src="https://placehold.co/280x280/ffd6e8/8a6d9e?text=%3A%29" alt="heeyeon 프로필 사진">

    <h1 class="name"><span class="name-deco" aria-hidden="true">🌸</span> heeyeon <span class="name-deco" aria-hidden="true">🌸</span></h1>
    <p class="tagline">버그보다 아름다운 것에 집중하는 개발자, heeyeon입니다</p>

    <div>
      <p class="section-title">좋아하는 것 3가지</p>
      <ul class="likes">
        <li><span class="emoji">☕</span> 아침에 마시는 라떼 한 잔</li>
        <li><span class="emoji">🎧</span> 로파이 음악 들으며 코딩하기</li>
        <li><span class="emoji">🐣</span> 파스텔톤 디자인 구경하기</li>
      </ul>
    </div>

    <div class="mood-section">
      <p class="section-title">오늘의 기분</p>
      <div class="mood-buttons">
        <button type="button" class="mood-btn" aria-label="신남" aria-pressed="false"
          data-message="신나는 기분이야">
          <span class="emoji">😊</span>
        </button>
        <button type="button" class="mood-btn" aria-label="차분" aria-pressed="false"
          data-message="조용한 시간이 좋아">
          <span class="emoji">🌿</span>
        </button>
        <button type="button" class="mood-btn" aria-label="무기력" aria-pressed="false"
          data-message="할 기운이 없어">
          <span class="emoji">💫</span>
        </button>
      </div>
      <p class="mood-message" id="mood-message" aria-live="polite"></p>
    </div>
  </main>

  <script>
    document.querySelectorAll('.mood-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.getElementById('mood-message').textContent = btn.dataset.message;
        document.querySelectorAll('.mood-btn').forEach(function (b) {
          b.classList.remove('is-selected');
          b.setAttribute('aria-pressed', 'false');
        });
        btn.classList.add('is-selected');
        btn.setAttribute('aria-pressed', 'true');
      });
    });
  </script>
</body>
</html>
