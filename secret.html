<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀 메모장 (보안 실습용 - 수정 버전)</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #2b2b3d;
    color: #eee;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }

  .container {
    width: 100%;
    max-width: 420px;
  }

  h1 {
    text-align: center;
    font-size: 1.4rem;
  }

  .warning {
    background: #2b4a34;
    border: 1px solid #2ecc71;
    color: #b6f2c9;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 20px;
  }

  .card {
    background: #383850;
    border-radius: 14px;
    padding: 20px;
  }

  input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-size: 1rem;
    margin-bottom: 10px;
    box-sizing: border-box;
  }

  button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #7c5cff;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }

  #lock-error,
  #setup-error {
    color: #ff9e9e;
    font-size: 0.85rem;
    min-height: 1.2em;
  }

  #setup-screen,
  #lock-screen,
  #note-area {
    display: none;
  }

  #note-list {
    margin-top: 14px;
    padding: 0;
    list-style: none;
  }

  #note-list li {
    background: #2f2f45;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 8px;
    word-break: break-all;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🔒 비밀 메모장</h1>
  <p class="warning">
    ✅ 보안 수업 실습용 페이지입니다. 이전 버전에서 발견된 3가지 취약점
    (비밀번호 하드코딩 / innerHTML XSS / 콘솔 로그 노출)을 수정했습니다.
  </p>

  <div class="card" id="setup-screen">
    <p>처음 사용하시네요! 사용할 비밀번호를 직접 설정해주세요.</p>
    <input type="password" id="setup-password-input" placeholder="새 비밀번호">
    <input type="password" id="setup-password-confirm" placeholder="비밀번호 확인">
    <button id="setup-btn" type="button">비밀번호 설정하기</button>
    <p id="setup-error"></p>
  </div>

  <div class="card" id="lock-screen">
    <p>비밀번호를 입력하세요</p>
    <input type="password" id="password-input" placeholder="비밀번호">
    <button id="unlock-btn" type="button">잠금 해제</button>
    <p id="lock-error"></p>
  </div>

  <div class="card" id="note-area">
    <input type="text" id="note-input" placeholder="메모를 입력하세요">
    <button id="add-note-btn" type="button">메모 추가</button>
    <ul id="note-list"></ul>
  </div>
</div>

<script>
  const STORAGE_KEY = 'secretNotePassword';

  const setupScreen = document.getElementById('setup-screen');
  const setupPasswordInput = document.getElementById('setup-password-input');
  const setupPasswordConfirm = document.getElementById('setup-password-confirm');
  const setupBtn = document.getElementById('setup-btn');
  const setupError = document.getElementById('setup-error');

  const lockScreen = document.getElementById('lock-screen');
  const noteArea = document.getElementById('note-area');
  const passwordInput = document.getElementById('password-input');
  const unlockBtn = document.getElementById('unlock-btn');
  const lockError = document.getElementById('lock-error');
  const noteInput = document.getElementById('note-input');
  const addNoteBtn = document.getElementById('add-note-btn');
  const noteList = document.getElementById('note-list');

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function init() {
    const savedPassword = localStorage.getItem(STORAGE_KEY);
    if (savedPassword) {
      lockScreen.style.display = 'block';
    } else {
      setupScreen.style.display = 'block';
    }
  }

  function setupPassword() {
    const pw = setupPasswordInput.value;
    const confirmPw = setupPasswordConfirm.value;

    if (!pw) {
      setupError.textContent = '비밀번호를 입력해주세요.';
      return;
    }
    if (pw !== confirmPw) {
      setupError.textContent = '비밀번호가 일치하지 않습니다.';
      return;
    }

    localStorage.setItem(STORAGE_KEY, pw);
    setupScreen.style.display = 'none';
    noteArea.style.display = 'block';
  }

  function checkPassword() {
    const input = passwordInput.value;
    const savedPassword = localStorage.getItem(STORAGE_KEY);

    if (input === savedPassword) {
      lockScreen.style.display = 'none';
      noteArea.style.display = 'block';
      lockError.textContent = '';
    } else {
      lockError.textContent = '비밀번호가 틀렸습니다.';
    }
  }

  setupBtn.addEventListener('click', setupPassword);
  [setupPasswordInput, setupPasswordConfirm].forEach((input) => {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') setupPassword();
    });
  });

  unlockBtn.addEventListener('click', checkPassword);
  passwordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') checkPassword();
  });

  function addNote() {
    const text = noteInput.value;
    if (!text) return;

    const li = document.createElement('li');
    li.innerHTML = escapeHtml(text);
    noteList.appendChild(li);

    noteInput.value = '';
  }

  addNoteBtn.addEventListener('click', addNote);
  noteInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addNote();
  });

  init();
</script>
</body>
</html>
