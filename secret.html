<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀 메모장 (보안 실습용 - 취약 버전)</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #2b2b3d;
    color: #eee;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }

  .container {
    width: 100%;
    max-width: 420px;
  }

  h1 {
    text-align: center;
    font-size: 1.4rem;
  }

  .warning {
    background: #4a2b2b;
    border: 1px solid #c0392b;
    color: #ffb3b3;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 20px;
  }

  .card {
    background: #383850;
    border-radius: 14px;
    padding: 20px;
  }

  input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-size: 1rem;
    margin-bottom: 10px;
    box-sizing: border-box;
  }

  button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #7c5cff;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }

  #lock-error {
    color: #ff9e9e;
    font-size: 0.85rem;
    min-height: 1.2em;
  }

  #note-area {
    display: none;
  }

  #note-list {
    margin-top: 14px;
    padding: 0;
    list-style: none;
  }

  #note-list li {
    background: #2f2f45;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 8px;
    word-break: break-all;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🔒 비밀 메모장</h1>
  <p class="warning">
    ⚠️ 보안 수업 실습용 페이지입니다. 아래 코드에는 의도적으로 취약한 부분 3곳이 포함되어 있습니다.
    개발자 도구(F12) 콘솔과 소스 코드를 직접 확인하며 문제를 찾아보세요.
  </p>

  <div class="card" id="lock-screen">
    <p>비밀번호를 입력하세요</p>
    <input type="password" id="password-input" placeholder="비밀번호">
    <button id="unlock-btn" type="button">잠금 해제</button>
    <p id="lock-error"></p>
  </div>

  <div class="card" id="note-area">
    <input type="text" id="note-input" placeholder="메모를 입력하세요 (HTML 태그도 그대로 표시됨)">
    <button id="add-note-btn" type="button">메모 추가</button>
    <ul id="note-list"></ul>
  </div>
</div>

<script>
  // ① 취약점: 비밀번호를 코드에 그대로 하드코딩
  const CORRECT_PASSWORD = "1234";

  const lockScreen = document.getElementById('lock-screen');
  const noteArea = document.getElementById('note-area');
  const passwordInput = document.getElementById('password-input');
  const unlockBtn = document.getElementById('unlock-btn');
  const lockError = document.getElementById('lock-error');
  const noteInput = document.getElementById('note-input');
  const addNoteBtn = document.getElementById('add-note-btn');
  const noteList = document.getElementById('note-list');

  function checkPassword() {
    const input = passwordInput.value;
    const isCorrect = input === CORRECT_PASSWORD;

    // ③ 취약점: 비밀번호 확인 결과(입력값 포함)를 콘솔에 그대로 출력
    console.log('password check:', input, '-> result:', isCorrect);

    if (isCorrect) {
      lockScreen.style.display = 'none';
      noteArea.style.display = 'block';
      lockError.textContent = '';
    } else {
      lockError.textContent = '비밀번호가 틀렸습니다.';
    }
  }

  unlockBtn.addEventListener('click', checkPassword);
  passwordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') checkPassword();
  });

  function addNote() {
    const text = noteInput.value;
    if (!text) return;

    const li = document.createElement('li');
    // ② 취약점: 사용자 입력을 escape 없이 innerHTML로 그대로 삽입 (XSS)
    li.innerHTML = text;
    noteList.appendChild(li);

    noteInput.value = '';
  }

  addNoteBtn.addEventListener('click', addNote);
  noteInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addNote();
  });
</script>
</body>
</html>
