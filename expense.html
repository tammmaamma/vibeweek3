<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미니 가계부 분석기</title>
<style>
  :root {
    --mint: #a8ecd3;
    --mint-light: #d9fbf0;
    --lemon: #fff6a8;
    --lemon-light: #fffde7;
    --text: #3f6b5e;
    --text-light: #7a9e91;
    --card-bg: #ffffff;
    --danger: #ff9eb5;
    --danger-dark: #ff7096;
    --accent: #4fd1a5;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, var(--mint) 0%, var(--mint-light) 50%, var(--lemon) 100%);
    background-attachment: fixed;
    color: var(--text);
    padding: 24px 16px 60px;
    display: flex;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 480px;
  }

  header {
    text-align: center;
    margin-bottom: 24px;
  }

  header h1 {
    font-size: 1.6rem;
    margin: 0 0 4px;
  }

  header p {
    margin: 0;
    color: var(--text-light);
    font-size: 0.9rem;
  }

  .card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 8px 24px rgba(79, 209, 165, 0.18);
    margin-bottom: 20px;
  }

  .input-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .input-row input {
    border: 2px solid var(--mint);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 1rem;
    outline: none;
    background: #f7fff9;
    color: var(--text);
    transition: border-color 0.2s;
  }

  .input-row input:focus {
    border-color: var(--accent);
  }

  #item-name {
    flex: 2;
    min-width: 120px;
  }

  #item-amount {
    flex: 1;
    min-width: 100px;
  }

  #add-btn {
    flex: 0 0 100%;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: #ffffff;
    background: linear-gradient(135deg, #5be0b3, #3fc296);
    box-shadow: 0 6px 16px rgba(79, 209, 165, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  #add-btn:hover {
    background: linear-gradient(135deg, #67e8bd, #34af88);
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(79, 209, 165, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.4);
  }

  #add-btn:active {
    transform: translateY(0) scale(0.98);
    box-shadow: 0 3px 8px rgba(79, 209, 165, 0.4);
  }

  #add-btn:focus-visible {
    outline: 3px solid #1f6b52;
    outline-offset: 2px;
  }

  ul#expense-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .expense-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-radius: 14px;
    background: var(--lemon-light);
    margin-bottom: 10px;
    animation: pop-in 0.2s ease;
  }

  @keyframes pop-in {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .expense-item .name {
    font-weight: 600;
    word-break: break-all;
    margin-right: 8px;
  }

  .expense-item .right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .expense-item .amount {
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  .delete-btn {
    border: none;
    background: linear-gradient(135deg, #ffb0c4, #ff7096);
    color: #fff;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 0.9rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(255, 112, 150, 0.35);
    transition: background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }

  .delete-btn:hover {
    background: linear-gradient(135deg, #ff9eb5, #ff5585);
    transform: scale(1.12) rotate(90deg);
    box-shadow: 0 4px 10px rgba(255, 112, 150, 0.5);
  }

  .delete-btn:active {
    transform: scale(0.95);
  }

  .delete-btn:focus-visible {
    outline: 2px solid var(--danger-dark);
    outline-offset: 2px;
  }

  .empty-message {
    text-align: center;
    color: var(--text-light);
    padding: 28px 16px;
    font-size: 1rem;
    line-height: 1.6;
    border: 2px dashed var(--mint);
    border-radius: 14px;
    background: var(--mint-light);
    animation: pop-in 0.25s ease;
  }

  .total-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(135deg, var(--mint), var(--lemon));
  }

  .total-card .label {
    font-size: 1rem;
    font-weight: 600;
  }

  .total-card .total-amount {
    font-size: 1.4rem;
    font-weight: 800;
    color: #1f6b52;
  }

  footer {
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-light);
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🍋 미니 가계부 분석기</h1>
      <p>민트 &amp; 레몬빛으로 상큼하게 기록해요</p>
    </header>

    <div class="card">
      <div class="input-row">
        <input type="text" id="item-name" placeholder="항목명 (예: 커피)" maxlength="30">
        <input type="number" id="item-amount" placeholder="금액" min="0" step="1">
        <button id="add-btn" type="button">+ 추가하기</button>
      </div>
    </div>

    <div class="card">
      <ul id="expense-list"></ul>
      <p class="empty-message" id="empty-message">아직 등록된 지출이 없어요 🌸</p>
    </div>

    <div class="card total-card">
      <span class="label">💰 총 합계</span>
      <span class="total-amount" id="total-amount">0원</span>
    </div>

    <footer>모든 데이터는 브라우저를 새로고침하면 초기화돼요</footer>
  </div>

<script>
  const nameInput = document.getElementById('item-name');
  const amountInput = document.getElementById('item-amount');
  const addBtn = document.getElementById('add-btn');
  const listEl = document.getElementById('expense-list');
  const totalEl = document.getElementById('total-amount');
  const emptyMessage = document.getElementById('empty-message');

  let expenses = [];

  function formatWon(num) {
    return num.toLocaleString('ko-KR') + '원';
  }

  function render() {
    listEl.innerHTML = '';

    if (expenses.length === 0) {
      emptyMessage.style.display = 'block';
    } else {
      emptyMessage.style.display = 'none';
      expenses.forEach((expense) => {
        const li = document.createElement('li');
        li.className = 'expense-item';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'name';
        nameSpan.textContent = expense.name;

        const right = document.createElement('div');
        right.className = 'right';

        const amountSpan = document.createElement('span');
        amountSpan.className = 'amount';
        amountSpan.textContent = formatWon(expense.amount);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.type = 'button';
        deleteBtn.textContent = '✕';
        deleteBtn.setAttribute('aria-label', expense.name + ' 삭제');
        deleteBtn.addEventListener('click', () => {
          expenses = expenses.filter((item) => item.id !== expense.id);
          render();
        });

        right.appendChild(amountSpan);
        right.appendChild(deleteBtn);
        li.appendChild(nameSpan);
        li.appendChild(right);
        listEl.appendChild(li);
      });
    }

    const total = expenses.reduce((sum, item) => sum + item.amount, 0);
    totalEl.textContent = formatWon(total);
  }

  function addExpense() {
    const name = nameInput.value.trim();
    const amount = Number(amountInput.value);

    if (!name) {
      nameInput.focus();
      return;
    }
    if (!amountInput.value || isNaN(amount) || amount < 0) {
      amountInput.focus();
      return;
    }

    expenses.push({ id: Date.now(), name, amount });
    nameInput.value = '';
    amountInput.value = '';
    nameInput.focus();
    render();
  }

  addBtn.addEventListener('click', addExpense);

  [nameInput, amountInput].forEach((input) => {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addExpense();
      }
    });
  });

  render();
</script>
</body>
</html>
