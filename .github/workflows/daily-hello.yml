name: Daily Hello

on:
  schedule:
    # 매일 00:00 UTC = 한국시간(KST) 09:00
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: quotes.txt에서 무작위 문구 선택 후 README 갱신
        run: |
          QUOTE=$(shuf -n 1 quotes.txt)
          awk -v q="$QUOTE" '
            /<!-- QUOTE:START -->/ { print; print q; skip=1; next }
            /<!-- QUOTE:END -->/ { skip=0 }
            !skip { print }
          ' README.md > README.md.tmp
          mv README.md.tmp README.md

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: 오늘의 한마디 갱신 ($(date +'%Y-%m-%d'))"
            git push
          else
            echo "변경 사항이 없어 커밋을 생략합니다."
          fi
